        $(document).ready(function(){

          // Add smooth scrolling to all links
          $(".fixed-side-navbar a, .primary-button a").on('click', function(event) {

            // Make sure this.hash has a value before overriding default behavior
            if (this.hash !== "") {
              // Prevent default anchor click behavior
              event.preventDefault();

              // Store hash
              var hash = this.hash;

              // Using jQuery's animate() method to add smooth page scroll
              // The optional number (800) specifies the number of milliseconds it takes to scroll to the specified area
            $('#content').animate({
                scrollTop: $(hash).offset().top
              }, 20, function(){
           
                // Add hash (#) to URL when done scrolling (default click behavior)
                window.location.hash = hash;
              });
            } // End if
          });
        });
    </script>

                    target = $this.attr('href');

        });

        function hide_nav(){
            if (window.innerWidth > 767){
                if (check === 0){
                    document.getElementById("nav_vertical").style.width = "13rem";
                    document.getElementById("content").style.paddingLeft = "13rem";
                    let x = document.getElementsByClassName("hide_nav_text");
                    let i;
                    for (i = 0; i < x.length; i++) {

                    }
                    check = 1

                    document.getElementById("nav_vertical").style.width = "calc(40px + 2rem)";

                    for (i = 0; i < x.length; i++) {

                    }
                    check = 0
                }

        function rgbCheckTogle(type = "onoff"){
            let rgbvalue = colorPicker.color.rgbString.replace(/[^0-9.,]/g, '').split(',');
			let alpha_range = document.getElementById('alpha_range');
			rgbvalue.push((alpha_range.value/10).toString())
            let color_selector = null;
            let contador = 0;
            $circles.forEach($circle =>
                function(){
                    contador += 1;
                    if ($circle.classList.contains("active")){
                        let color_selector = $circles.indexOf($circle);
                    }else{
                        if(contador == ($circles.length - 1)){
                            let color_selector = null;   
                        }
                    }
                }
            );   
            if (circulo_power.classList.contains("active")){
                const sendrgb = '{"type":"'+type+'", "rgbvalue":['+rgbvalue+'], "speed":5}'
                console.log("enviado")
                console.log(sendrgb);
                socket.send(sendrgb);
            }else{
                const sendrgb = '{"type":"'+type+'", "rgbvalue":[0,0,0,0], "speed":5}';
                console.log("enviado")
                console.log(sendrgb);
                socket.send(sendrgb);
            }
        }

        function rgbRainbowTogle(){
            let rgbvalue = colorPicker.color.rgbString.replace(/[^0-9.,]/g, '').split(',');
            let speed_range = document.getElementById('speed_range');
            let alpha_range = document.getElementById('alpha_range');
			rgbvalue.push((alpha_range.value/10).toString())

            const sendrgb = '{"type":"rainbow", "rgbvalue":['+rgbvalue+'], "speed":'+speed_range.value+'}';
            socket.send(sendrgb);
        }

        socket.onmessage = (event) => {
            console.log('Received message from server:', event.data);
            let rgbstr = "rgb(" + data.rgbvalue[0] + ", " + data.rgbvalue[1] + ", " + data.rgbvalue[2] + ")";
            colorPicker.color.set(rgbstr);
			document.getElementById('alpha_range').value = parseFloat(data.rgbvalue[3])*10;
            if (data.check){
                circulo_power.classList.add("active");
            }else{
                if(circulo_power.classList.contains("active")){
                    circulo_power.classList.remove("active");
                }
            }
        };
